global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: anim_agent
    metrics_path: /metrics
    static_configs:
      # The LangGraph approval agent (:8700). Exposes per-video (job) metrics:
      # completed videos, clips-by-mode, regenerations, video duration.
      - targets: ["host.docker.internal:8700"]
