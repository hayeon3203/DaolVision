services:
  prometheus:
    image: prom/prometheus:latest
    container_name: hyv-prometheus
    # Linux 도커에는 host.docker.internal이 기본 제공되지 않는다(맥/윈도우 전용).
    # prometheus.yml의 타겟이 이 이름을 쓰므로 host-gateway로 매핑해 준다 —
    # 없으면 스크레이프가 DNS 단계에서 실패해 대시보드 전체가 no data가 된다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9595:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: hyv-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  prometheus_data:
  grafana_data:
